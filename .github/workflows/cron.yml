name: 5-Minute ResultWatcher Vercel Cron Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-vercel-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ResultWatcher Vercel Endpoint
        run: |
          echo "Triggering Vercel Serverless Cron Endpoint..."
          curl -s -f "https://result-watcher.vercel.app/api/cron" || echo "Vercel endpoint ping completed."
